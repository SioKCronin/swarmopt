name: Rust deep-space prototype

on:
  push:
    branches: [master]
    paths:
      - "prototypes/deep_space/**"
      - ".github/workflows/rust-prototype.yml"
  pull_request:
    paths:
      - "prototypes/deep_space/**"
      - ".github/workflows/rust-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-prototype-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: prototypes/deep_space

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Determinism must hold across platforms.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  no_std:
    name: Bare-metal build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, riscv32imac-unknown-none-elf]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --lib --release --target ${{ matrix.target }}
