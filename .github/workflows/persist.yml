name: Persist (Rust)

# The swarmopt-persist crate and its Python bindings. Uses the Rust toolchain
# preinstalled on GitHub runners, so no third-party actions beyond the
# pinned checkout/setup-python ones the other workflows already trust.

on:
  push:
    branches: [master]
    paths: ["rust/**", "swarmopt/persist.py", "swarmopt/swarm.py", "tests/unit/test_persist.py", ".github/workflows/persist.yml"]
  pull_request:
    paths: ["rust/**", "swarmopt/persist.py", "swarmopt/swarm.py", "tests/unit/test_persist.py", ".github/workflows/persist.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persist-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust/persist

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features python -- -D warnings
      - name: Unit and fault-injection tests (release, overflow checks on)
        run: cargo test --locked --release

  python:
    name: Python bindings (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build and install the extension
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin==1.16.0"
          maturin build --release --locked --out dist
          python -m pip install dist/*.whl
      - name: Install swarmopt
        working-directory: .
        run: python -m pip install -e ".[dev]"
      - name: Persistence tests (must not be skipped here)
        working-directory: .
        run: |
          python -c "import swarmopt.persist as p; assert p.available()"
          python -m pytest tests/unit -q
