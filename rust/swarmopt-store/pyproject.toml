[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "swarmopt-store"
description = "Crash-safe, corruption-tolerant persistence for SwarmOpt (Rust)"
requires-python = ">=3.10"
license = "MIT"
dynamic = ["version"]

[tool.maturin]
features = ["python"]
module-name = "swarmopt_store"
