name: Integration

# The integration tests run under pytest (tests/integration/conftest.py turns
# their returned results into assertions) along with the slow statistical
# unit tests. Together they take a couple of minutes, so they run on pull
# requests as well as weekly.
on:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[viz,dev]"
      - name: Integration tests
        env:
          MPLBACKEND: Agg
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests/integration" -q -p no:cacheprovider
      - name: Slow statistical tests
        run: python -m pytest tests/unit -m slow -q
